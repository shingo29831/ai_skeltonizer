# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiskel"
version = "0.1.0"
description = "AIコンテキスト向けの多言語コード最適化・スケルトン生成ツール"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
# コア依存モジュール (pip install -e . 実行時に自動インストールされます)
dependencies = [
    "pathspec>=0.12.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[project.scripts]
# コマンドラインから 'aiskel' または 'skelify' として直接実行できるようにするエイリアス設定
aiskel = "aiskel.cli:main"
skelify = "aiskel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]